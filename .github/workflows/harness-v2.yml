name: ESR state and forward contracts
on:
  push:
    paths: ['src/esr_harness/**', 'tests/harness_v2/**', 'tests/harness_v21/**', 'tests/__init__.py', 'pyproject.toml', '.github/workflows/harness-v2.yml']
  pull_request:
    paths: ['src/esr_harness/**', 'tests/harness_v2/**', 'tests/harness_v21/**', 'tests/__init__.py', 'pyproject.toml', '.github/workflows/harness-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forward-invariants:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m esr_harness smoke --store /tmp/esr21-smoke.sqlite
      - run: python -m esr_harness replay /tmp/esr21-smoke.sqlite
      - name: Archive exact source snapshot, not model experiments
        if: always() && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: harness-source-${{ github.sha }}
          retention-days: 7
          include-hidden-files: true
          path: |
            src/
            tests/
            docs/harness/
            docs/research/state_21/
            pyproject.toml
            README.md
            .github/workflows/harness-v2.yml
            !**/__pycache__/**
            !**/*.pyc
