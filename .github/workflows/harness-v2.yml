name: ESR forward harness
on:
  push:
    paths: ['src/esr_harness/**', 'tests/harness_v2/**', 'tests/harness_v21/**', 'pyproject.toml', '.github/workflows/harness-v2.yml']
  pull_request:
    paths: ['src/esr_harness/**', 'tests/harness_v2/**', 'tests/harness_v21/**', 'pyproject.toml', '.github/workflows/harness-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forward-invariants:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Run forward contract tests
        run: |
          python -m pytest -q tests/harness_v2
          if [ -d tests/harness_v21 ]; then python -m pytest -q tests/harness_v21; fi
      - run: python -m esr_harness smoke --store /tmp/esr-smoke.sqlite
      - run: python -m esr_harness replay /tmp/esr-smoke.sqlite
      - name: Archive exact source snapshot (not model experiments)
        if: always() && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: harness-source-${{ github.sha }}
          retention-days: 7
          include-hidden-files: true
          path: |
            src/
            tests/
            pyproject.toml
            README.md
            .github/workflows/harness-v2.yml
