name: ESR forward harness v2
on:
  push:
    paths: ['src/esr_harness/**', 'tests/harness_v2/**', 'pyproject.toml', '.github/workflows/harness-v2.yml']
  pull_request:
    paths: ['src/esr_harness/**', 'tests/harness_v2/**', 'pyproject.toml', '.github/workflows/harness-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forward-invariants:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/harness_v2
      - run: python -m esr_harness smoke --store /tmp/esr-smoke.sqlite
      - run: python -m esr_harness replay /tmp/esr-smoke.sqlite
